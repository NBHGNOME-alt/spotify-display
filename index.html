<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#111111" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Now Playing" />
  <title>Spotify Now Playing</title>
  <style>
    :root {
      --bg: rgb(32, 32, 32);
      --fg: white;
      --muted: rgba(255,255,255,.72);
    }
    * { box-sizing: border-box; }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; background:var(--bg); }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
      color:var(--fg);
      -webkit-user-select:none;
      user-select:none;
    }
    #backdrop {
      position:fixed; inset:-8vmax;
      background:var(--bg);
      transition:background 900ms ease;
      z-index:0;
    }
    #backdrop::after{
      content:"";
      position:absolute; inset:0;
      background:
        radial-gradient(circle at 50% 42%, rgba(255,255,255,.07), transparent 38%),
        linear-gradient(to bottom, rgba(0,0,0,.03), rgba(0,0,0,.34));
      pointer-events:none;
    }
    #app {
      position:relative; z-index:1;
      width:100%; height:100%;
      padding:
        max(22px, env(safe-area-inset-top))
        max(24px, env(safe-area-inset-right))
        max(28px, env(safe-area-inset-bottom))
        max(24px, env(safe-area-inset-left));
      display:grid;
      grid-template-rows: minmax(0, 1fr) auto;
      gap:clamp(18px, 3vh, 34px);
    }
    #art-wrap {
      min-height:0;
      display:flex;
      align-items:center;
      justify-content:center;
      padding-top:1vh;
    }
    #art {
      display:block;
      width:min(78vw, 72vh);
      height:min(78vw, 72vh);
      max-width:100%;
      max-height:100%;
      object-fit:cover;
      border-radius:3px;
      box-shadow:0 26px 80px rgba(0,0,0,.28);
      opacity:0;
      transform:scale(.992);
      transition:opacity 500ms ease, transform 700ms ease;
    }
    #art.loaded { opacity:1; transform:scale(1); }
    #meta {
      align-self:end;
      padding:0 0 .5vh .2vw;
      text-shadow:0 2px 18px rgba(0,0,0,.20);
      min-width:0;
    }
    #title {
      font-size:clamp(28px, 4.6vw, 64px);
      line-height:1.02;
      font-weight:750;
      letter-spacing:-.035em;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      margin:0;
    }
    #artist {
      font-size:clamp(18px, 2.6vw, 34px);
      line-height:1.15;
      font-weight:520;
      letter-spacing:-.018em;
      color:var(--muted);
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      margin-top:.35em;
    }
    #status {
      position:fixed;
      inset:0;
      z-index:10;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:28px;
      background:#111;
    }
    .card {
      width:min(560px, 100%);
      background:#1b1b1b;
      border:1px solid rgba(255,255,255,.10);
      border-radius:24px;
      padding:28px;
      box-shadow:0 24px 80px rgba(0,0,0,.35);
    }
    .card h1 { margin:0 0 12px; font-size:32px; letter-spacing:-.03em; }
    .card p { color:#c9c9c9; line-height:1.45; margin:10px 0; }
    .card small { color:#999; line-height:1.4; display:block; margin-top:14px; }
    input {
      width:100%;
      margin:12px 0 6px;
      border:1px solid #444;
      background:#101010;
      color:white;
      font:inherit;
      padding:14px 15px;
      border-radius:12px;
      outline:none;
    }
    button {
      width:100%;
      margin-top:10px;
      border:0;
      border-radius:999px;
      padding:14px 18px;
      font:700 16px/1 -apple-system, BlinkMacSystemFont, sans-serif;
      background:#1ed760;
      color:#07150c;
    }
    #hint { margin-top:14px; font-size:13px; color:#8d8d8d; word-break:break-all; }
    #tapzone {
      position:fixed; right:0; top:0; width:90px; height:90px; z-index:5;
    }
    #menu {
      position:fixed; right:18px; top:18px; z-index:6;
      opacity:0; pointer-events:none; transition:opacity .18s;
      background:rgba(0,0,0,.55); backdrop-filter:blur(18px);
      border:1px solid rgba(255,255,255,.15); border-radius:14px; padding:8px;
    }
    #menu.show { opacity:1; pointer-events:auto; }
    #menu button {
      width:auto; margin:0; background:transparent; color:white;
      padding:10px 12px; font-weight:600;
    }
    @media (orientation: landscape) {
      #app {
        grid-template-columns:minmax(0, 1fr) minmax(260px, 38vw);
        grid-template-rows:1fr;
        align-items:center;
        gap:4.5vw;
        padding-left:max(34px, env(safe-area-inset-left));
        padding-right:max(34px, env(safe-area-inset-right));
      }
      #art-wrap { padding-top:0; justify-content:flex-end; }
      #art {
        width:min(57vw, 78vh);
        height:min(57vw, 78vh);
      }
      #meta { align-self:end; padding-bottom:5vh; }
      #title { white-space:normal; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; }
      #artist { white-space:normal; }
    }

#pixel-glass { position:fixed; inset:0; width:100%; height:100%; z-index:0; display:none; image-rendering:pixelated; image-rendering:crisp-edges; }
body:is([data-theme="pixel"],[data-theme="pixel-v2"]) #pixel-glass { display:block; }
body:is([data-theme="pixel"],[data-theme="pixel-v2"]) #glass { visibility:hidden; }
#glass { position:fixed; inset:0; width:100%; height:100%; z-index:0; display:none; background:#22232b; }
body:is([data-theme="glass"],[data-theme="pixel"],[data-theme="pixel-v2"]) #glass { display:block; }
body:is([data-theme="glass"],[data-theme="pixel"],[data-theme="pixel-v2"]) #backdrop { display:none; }
/* Continue the patterned background through the iPad bottom safe area. */
body:is([data-theme="glass"],[data-theme="pixel"],[data-theme="pixel-v2"]) #glass,
body:is([data-theme="glass"],[data-theme="pixel"],[data-theme="pixel-v2"]) #pixel-glass {
  bottom:auto;
  height:calc(100% + env(safe-area-inset-bottom,0px));
  min-height:100lvh;
}

body:is([data-theme="glass"],[data-theme="pixel"],[data-theme="pixel-v2"]) #app {
  grid-template-columns:minmax(0,1fr) minmax(0,38vw);
  grid-template-rows:minmax(0,1fr);
  align-items:center;
  gap:4.5vw;
  padding-left:max(34px,env(safe-area-inset-left));
  padding-right:max(34px,env(safe-area-inset-right));
}
body:is([data-theme="glass"],[data-theme="pixel"],[data-theme="pixel-v2"]) #art-wrap { padding-top:0; justify-content:flex-end; }
body:is([data-theme="glass"],[data-theme="pixel"],[data-theme="pixel-v2"]) #art { width:min(57vw,78vh); height:auto; aspect-ratio:1; }
body:is([data-theme="glass"],[data-theme="pixel"],[data-theme="pixel-v2"]) #meta { align-self:end; padding-bottom:5vh; }
body:is([data-theme="glass"],[data-theme="pixel"],[data-theme="pixel-v2"]) #title { white-space:normal; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; }
body:is([data-theme="glass"],[data-theme="pixel"],[data-theme="pixel-v2"]) #artist { white-space:normal; }

body:is([data-theme="glass"],[data-theme="pixel"],[data-theme="pixel-v2"]) #title,
body:is([data-theme="glass"],[data-theme="pixel"],[data-theme="pixel-v2"]) #artist {
  font-family:"Fayte Pixel Soft",Georgia,serif;
  font-weight:400;
  font-synthesis:none;
  letter-spacing:0;
}
body:is([data-theme="glass"],[data-theme="pixel"],[data-theme="pixel-v2"]) #title { font-size:clamp(44px,7.4vw,104px); line-height:1.08; }
body:is([data-theme="glass"],[data-theme="pixel"],[data-theme="pixel-v2"]) #artist { color:#ece3c8; font-size:clamp(29px,4.2vw,55px); line-height:1.15; }
body[data-theme="pixel-v2"] #title {
  font-size:clamp(22px,3.7vw,52px);
  line-height:1.15;
  display:block;
  -webkit-line-clamp:unset;
  white-space:normal;
  overflow:visible;
  overflow-wrap:anywhere;
  text-overflow:clip;
}
body[data-theme="pixel-v2"] #meta { max-height:100%; overflow-y:auto; }
#tapzone { width:54px; height:54px; padding:0; margin:0; border-radius:0; background:transparent; color:white; opacity:.18; font-size:24px; z-index:11; }
#tapzone:hover,#tapzone:focus-visible { opacity:1; }
#menu { top:58px; width:min(310px,calc(100vw - 36px)); padding:18px; background:#18181df2; z-index:12; visibility:hidden; }
#menu.show { visibility:visible; }
#menu label { display:block; font-size:14px; margin-bottom:8px; }
#menu select { width:100%; background:#303038; color:white; font:inherit; padding:10px; border:1px solid #666; border-radius:8px; }
#menu button { width:100%; text-align:left; min-height:44px; }
#menu small { display:block; color:#c8c8cf; font-size:12px; line-height:1.4; margin:8px 0; }
#menu .font-control { margin-top:18px; }
#menu .font-control button { background:#353541; border-radius:8px; }
@media(prefers-reduced-motion:reduce) { #art,#backdrop { transition:none; } }

  </style>

<body>
  <div id="backdrop"></div>
  <canvas id="pixel-glass" aria-hidden="true"></canvas>
  <svg id="glass" viewBox="0 0 100 75" preserveAspectRatio="none" aria-hidden="true"></svg>

  <main id="app">
    <div id="art-wrap"><img id="art" alt="" /></div>
    <section id="meta">
      <h1 id="title"></h1>
      <div id="artist"></div>
    </section>
  </main>

  <button id="tapzone" aria-label="Appearance and settings" aria-controls="menu" aria-expanded="false">⋯</button>
  <div id="menu">
    <label for="theme-choice">Appearance</label>
    <select id="theme-choice"><option value="glass">Stained Glass</option><option value="pixel">Pixel Stained Glass</option><option value="pixel-v2">Pixel Glass v2</option><option value="current">Basic</option></select>
    <button id="logout">Reset Spotify login</button>
  </div>

  <section id="status">
    <div class="card">
      <h1>Spotify Display</h1>
      <p>Paste the <strong>Client ID</strong> from your Spotify Developer app. It stays only in this browser.</p>
      <input id="clientId" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Spotify Client ID" />
      <button id="connect">Connect Spotify</button>
      <div id="hint"></div>
      <small>This app reads only your currently-playing item. It does not contain a Spotify client secret.</small>
    </div>
  </section>

<script>
const SCOPE = "user-read-currently-playing";
const TOKEN_URL = "https://accounts.spotify.com/api/token";
const AUTH_URL = "https://accounts.spotify.com/authorize";
const API_URL = "https://api.spotify.com/v1/me/player/currently-playing";

const $ = (id) => document.getElementById(id);
const statusEl = $("status");
const clientInput = $("clientId");
const connectBtn = $("connect");
const hint = $("hint");
const art = $("art");
const title = $("title");
const artist = $("artist");
const backdrop = $("backdrop");

// Stable geometric panes; only their palette changes with the album.
const glass = $("glass");
let glassPalette = [[48,57,79],[79,51,74],[105,84,43],[47,58,86],[71,50,87]];
function glassCells() {
  let seed=20260908;
  const random=()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296;};
  const sites=[];
  for(let y=0;y<5;y++) for(let x=0;x<7;x++) sites.push([(x+.2+random()*.6)*100/7,(y+.2+random()*.6)*75/5]);
  return sites.map((p,i)=>{
    let poly=[[0,0],[100,0],[100,75],[0,75]];
    sites.forEach((q,j)=>{
      if(i===j || !poly.length)return;
      const nx=q[0]-p[0],ny=q[1]-p[1],c=(q[0]*q[0]+q[1]*q[1]-p[0]*p[0]-p[1]*p[1])/2;
      const next=[];
      for(let k=0;k<poly.length;k++) {
        const a=poly[k],b=poly[(k+1)%poly.length],da=a[0]*nx+a[1]*ny-c,db=b[0]*nx+b[1]*ny-c;
        if(da<=0)next.push(a);
        if((da<=0)!==(db<=0)){const t=da/(da-db);next.push([a[0]+t*(b[0]-a[0]),a[1]+t*(b[1]-a[1])]);}
      }
      poly=next;
    });
    return poly;
  });
}
const paneGeometry=glassCells();
function renderGlass() {
  if(document.body.dataset.theme==='pixel')renderPixelGlass();
  if(document.body.dataset.theme==='pixel-v2')renderPixelGlassV2();
  const rgb=(c)=>`rgb(${c.map(v=>Math.max(0,Math.min(255,Math.round(v)))).join(',')})`;
  const gradients=glassPalette.map((c,i)=>`<linearGradient id="pane-${i}" x1="0" y1="0" x2="1" y2="1"><stop stop-color="${rgb(c.map(v=>v*1.12))}"/><stop offset="1" stop-color="${rgb(c.map(v=>v*.82))}"/></linearGradient>`).join('');
  const panes=paneGeometry.map((poly,i)=>`<polygon points="${poly.map(p=>p.map(v=>v.toFixed(3)).join(',')).join(' ')}" fill="url(#pane-${(i*7+Math.floor(i/7)*3)%glassPalette.length})" stroke="#17161e" stroke-width=".42" stroke-linejoin="round"/>`).join('');
  glass.innerHTML=`<defs>${gradients}<linearGradient id="glass-shade" x1="0" y1="0" x2="0" y2="1"><stop offset=".5" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".62"/></linearGradient></defs>${panes}<rect width="100" height="75" fill="url(#glass-shade)"/>`;
}
// Render at a deliberately small resolution; CSS scales whole square pixels.
function renderPixelGlass() {
  const canvas=$("pixel-glass"),w=240,h=Math.max(90,Math.min(400,Math.round(w*innerHeight/innerWidth)));
  canvas.width=w;canvas.height=h;
  const ctx=canvas.getContext('2d'),frame=ctx.createImageData(w,h);
  const bayer=[[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
  for(let y=0;y<h;y++)for(let x=0;x<w;x++) {
    const px=(x+.5)*100/w,py=(y+.5)*75/h;
    let pane=0,edge=Infinity;
    for(let i=0;i<paneGeometry.length;i++) {
      const poly=paneGeometry[i];let inside=false;
      for(let a=0,b=poly.length-1;a<poly.length;b=a++) {
        const u=poly[a],v=poly[b];
        if((u[1]>py)!==(v[1]>py)&&px<(v[0]-u[0])*(py-u[1])/(v[1]-u[1])+u[0])inside=!inside;
      }
      if(!inside)continue;
      pane=i;
      for(let a=0;a<poly.length;a++) {
        const u=poly[a],v=poly[(a+1)%poly.length],dx=v[0]-u[0],dy=v[1]-u[1];
        const t=Math.max(0,Math.min(1,((px-u[0])*dx+(py-u[1])*dy)/(dx*dx+dy*dy)));
        edge=Math.min(edge,Math.hypot(px-u[0]-t*dx,py-u[1]-t*dy));
      }
      break;
    }
    const base=glassPalette[(pane*7+Math.floor(pane/7)*3)%glassPalette.length];
    const ramp=1.10-.27*y/h+.06*Math.sin(x/23+pane);
    const scaled=ramp*5,shade=(Math.floor(scaled)+(scaled%1>bayer[y%4][x%4]/16?1:0))/5;
    const bottom=1-.48*Math.max(0,(y/h-.5)*2);
    const offset=(y*w+x)*4;
    for(let k=0;k<3;k++) frame.data[offset+k]=edge<.48?[20,23,34][k]:Math.round(base[k]*shade*bottom);
    frame.data[offset+3]=255;
  }
  ctx.putImageData(frame,0,0);
}
// Uneven cut-glass panels, deliberately unlike the regular Voronoi cells in v1.
function pixelV2Cells() {
  // A composed pane map: broad panes, tall strips and sharp wedges.
  // Only selected shared seams curve; the rest remain straight.
  const rows=[
    [[0,0],[6,0],[24,0],[42,0],[63,0],[85,0],[100,0]],
    [[0,19],[12,11],[28,8],[40,23],[65,15],[91,25],[100,18]],
    [[0,39],[8,30],[29,36],[53,31],[69,40],[87,34],[100,41]],
    [[0,58],[22,49],[38,57],[60,48],[78,59],[94,53],[100,59]],
    [[0,75],[12,75],[34,75],[56,75],[73,75],[87,75],[100,75]]
  ];
  const points=rows.flat();
  const faces=[];
  for(let r=0;r<4;r++)for(let c=0;c<6;c++) {
    const a=r*7+c,b=a+1,d=a+7,e=d+1;
    // Split a few deliberately chosen panes into narrow triangular accents.
    if((r===0&&c===4)||(r===2&&c===0)||(r===3&&c===4))faces.push([a,b,d],[b,e,d]);
    else faces.push([a,b,e,d]);
  }
  const curves=new Map();
  const bow=(a,b,amount)=>curves.set(`${Math.min(a,b)}:${Math.max(a,b)}`,a<b?amount:-amount);
  // Rounded crowns and shoulders among crisp angular panes.
  bow(8,9,-4.4); bow(9,16,-3.3); bow(15,16,3.2); bow(8,15,2.0);
  bow(11,12,-3.3); bow(11,18,2.6);
  bow(16,17,-2.5); bow(17,24,-3.7); bow(23,24,3.1);
  bow(19,20,-2.0); bow(19,26,2.8);
  bow(22,29,3.1); bow(24,31,-3.0); bow(25,32,2.5);
  const edges=new Map();
  function edge(a,b) {
    const lo=Math.min(a,b),hi=Math.max(a,b),key=`${lo}:${hi}`;
    if(!edges.has(key)) {
      const u=points[lo],v=points[hi],amount=curves.get(key)||0;
      const dx=v[0]-u[0],dy=v[1]-u[1],len=Math.hypot(dx,dy);
      const curve=[];const steps=amount?12:1;
      for(let i=0;i<=steps;i++) {
        const t=i/steps,bulge=4*t*(1-t)*amount;
        curve.push([u[0]+t*dx-dy/len*bulge,u[1]+t*dy+dx/len*bulge]);
      }
      edges.set(key,curve);
    }
    const path=edges.get(key);
    return a===lo?path:[...path].reverse();
  }
  return faces.map(face=>face.flatMap((a,i)=>edge(a,face[(i+1)%face.length]).slice(0,-1)));
}
const pixelV2Geometry=pixelV2Cells();
const pixelV2Bounds=pixelV2Geometry.map(p=>[Math.min(...p.map(v=>v[0])),Math.min(...p.map(v=>v[1])),Math.max(...p.map(v=>v[0])),Math.max(...p.map(v=>v[1]))]);
let pixelV2Cache;
function renderPixelGlassV2() {
  const canvas=$("pixel-glass"),w=600,h=Math.max(240,Math.min(1000,Math.round(w*innerHeight/innerWidth)));
  canvas.width=w;canvas.height=h;
  const ctx=canvas.getContext('2d');
  if(!pixelV2Cache||pixelV2Cache.w!==w||pixelV2Cache.h!==h) {
    const panes=new Uint8Array(w*h),shades=new Float32Array(w*h);
    // Shared hand-shaped edges meet exactly; no global waviness.
    const centers=pixelV2Geometry.map(p=>[p.reduce((s,v)=>s+v[0],0)/p.length,p.reduce((s,v)=>s+v[1],0)/p.length]);
    const bayer=[[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
    for(let y=0;y<h;y++)for(let x=0;x<w;x++) {
      const ox=(x+.5)*100/w,oy=(y+.5)*75/h;
      const px=ox;
      const py=oy;
      const index=y*w+x;let pane=-1,edge=Infinity;
      // Clamp only outer coordinates, leaving the internal warped joints intact.
      const X=Math.max(.001,Math.min(99.999,px)),Y=Math.max(.001,Math.min(74.999,py));
      for(let i=0;i<pixelV2Geometry.length;i++) {
        const bounds=pixelV2Bounds[i];
        if(X<bounds[0]||Y<bounds[1]||X>bounds[2]||Y>bounds[3])continue;
        const poly=pixelV2Geometry[i];let inside=false;
        for(let a=0,b=poly.length-1;a<poly.length;b=a++) {
          const u=poly[a],v=poly[b];
          if((u[1]>Y)!==(v[1]>Y)&&X<(v[0]-u[0])*(Y-u[1])/(v[1]-u[1])+u[0])inside=!inside;
        }
        if(!inside)continue;
        pane=i;
        for(let a=0;a<poly.length;a++) {
          const u=poly[a],v=poly[(a+1)%poly.length],dx=v[0]-u[0],dy=v[1]-u[1];
          if((u[0]===v[0]&&(u[0]===0||u[0]===100))||(u[1]===v[1]&&(u[1]===0||u[1]===75)))continue;
          const t=Math.max(0,Math.min(1,((X-u[0])*dx+(Y-u[1])*dy)/(dx*dx+dy*dy)));
          edge=Math.min(edge,Math.hypot(X-u[0]-t*dx,Y-u[1]-t*dy));
        }
        break;
      }
      if(pane<0||edge<.30){panes[index]=255;continue;}
      panes[index]=pane;
      const center=centers[pane],direction=pane*2.39996;
      const across=((X-center[0])*Math.cos(direction)+(Y-center[1])*Math.sin(direction))/24;
      const light=.99+across*.24+.09*Math.sin(X*.19+Y*.13+pane);
      const levels=light*7,blend=Math.max(0,Math.min(1,(levels%1-.25)*2));
      const shade=(Math.floor(levels)+(blend>(bayer[y%4][x%4]+.5)/16?1:0))/7;
      shades[index]=shade*(1-.44*Math.max(0,(y/h-.48)/.52));
    }
    pixelV2Cache={w,h,panes,shades};
  }
  const frame=ctx.createImageData(w,h),{panes,shades}=pixelV2Cache;
  for(let i=0;i<panes.length;i++) {
    const p=panes[i],base=glassPalette[(p*7+Math.floor(p/3))%glassPalette.length];
    for(let k=0;k<3;k++)frame.data[i*4+k]=p===255?[17,23,34][k]:Math.round(base[k]*shades[i]*1.12);
    frame.data[i*4+3]=255;
  }
  ctx.putImageData(frame,0,0);
}

let pixelResize;
addEventListener('resize',()=>{clearTimeout(pixelResize);pixelResize=setTimeout(()=>{if(document.body.dataset.theme==='pixel')renderPixelGlass();if(document.body.dataset.theme==='pixel-v2')renderPixelGlassV2();},120);});
function updateGlassPalette(data) {
  const buckets=new Map();
  for(let i=0;i<data.length;i+=4) {
    if(data[i+3]<128)continue;
    const r=data[i],g=data[i+1],b=data[i+2],bright=Math.max(r,g,b);
    if(bright<28 || Math.min(r,g,b)>238)continue;
    const key=(r>>5)*64+(g>>5)*8+(b>>5),bin=buckets.get(key)||[0,0,0,0];
    bin[0]+=r;bin[1]+=g;bin[2]+=b;bin[3]++;buckets.set(key,bin);
  }
  const candidates=Array.from(buckets.values()).map(bin=>({rgb:bin.slice(0,3).map(v=>v/bin[3]),n:bin[3]}));
  const score=c=>c.n*(.4+(Math.max(...c.rgb)-Math.min(...c.rgb))/100);
  candidates.sort((a,b)=>score(b)-score(a));
  const chosen=[];
  for(const c of candidates) {
    if(chosen.every(p=>p.reduce((sum,v,k)=>sum+(v-c.rgb[k])**2,0)>2500))chosen.push(c.rgb);
    if(chosen.length===6)break;
  }
  if(!chosen.length)chosen.push([65,65,70]);
  glassPalette=chosen.map(c=>{
    const gray=.2126*c[0]+.7152*c[1]+.0722*c[2];
    return c.map(v=>(gray+(v-gray)*.6)*.80);
  });
  renderGlass();
}
function setTheme(theme) {
  const chosen=['current','glass','pixel','pixel-v2'].includes(theme)?theme:'glass';
  document.body.dataset.theme=chosen;
  if(chosen==='pixel') renderPixelGlass();
  if(chosen==='pixel-v2') renderPixelGlassV2();
  $("theme-choice").value=chosen;
  try{localStorage.setItem('spotify_display_theme',chosen);}catch{}
}
$("theme-choice").addEventListener('change',e=>setTheme(e.target.value));
let initialTheme='glass';
try{initialTheme=localStorage.getItem('spotify_display_theme')||'glass';}catch{}
setTheme(initialTheme);renderGlass();

function toggleMenu(open) {
  $("menu").classList.toggle('show',open);
  $("tapzone").setAttribute('aria-expanded',String(open));
}
$("tapzone").addEventListener('click',()=>toggleMenu(!$("menu").classList.contains('show')));
document.addEventListener('keydown',e=>{if(e.key==='Escape')toggleMenu(false);});
document.addEventListener('click',e=>{if(!$("menu").contains(e.target)&&!$("tapzone").contains(e.target))toggleMenu(false);});

function redirectUri() {
  return location.origin + location.pathname;
}
hint.textContent = "Redirect URI to add in Spotify: " + redirectUri();
clientInput.value = localStorage.getItem("spotify_client_id") || "";

function base64url(bytes) {
  return btoa(String.fromCharCode(...new Uint8Array(bytes)))
    .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
async function sha256(text) {
  return crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
}
function randomString(len=64) {
  const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~";
  const values = crypto.getRandomValues(new Uint8Array(len));
  return Array.from(values, x => chars[x % chars.length]).join("");
}

async function startLogin() {
  const clientId = clientInput.value.trim();
  if (!clientId) return;
  localStorage.setItem("spotify_client_id", clientId);

  const verifier = randomString(64);
  const challenge = base64url(await sha256(verifier));
  sessionStorage.setItem("pkce_verifier", verifier);

  const state = randomString(24);
  sessionStorage.setItem("oauth_state", state);

  const p = new URLSearchParams({
    client_id: clientId,
    response_type: "code",
    redirect_uri: redirectUri(),
    scope: SCOPE,
    code_challenge_method: "S256",
    code_challenge: challenge,
    state
  });
  location.href = AUTH_URL + "?" + p.toString();
}

async function exchangeCode(code) {
  const clientId = localStorage.getItem("spotify_client_id");
  const verifier = sessionStorage.getItem("pkce_verifier");
  if (!clientId || !verifier) throw new Error("Missing login state. Please connect again.");

  const body = new URLSearchParams({
    client_id: clientId,
    grant_type: "authorization_code",
    code,
    redirect_uri: redirectUri(),
    code_verifier: verifier
  });

  const r = await fetch(TOKEN_URL, {
    method:"POST",
    headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body
  });
  if (!r.ok) throw new Error("Spotify login failed.");
  const t = await r.json();
  saveTokens(t);
  history.replaceState({}, "", redirectUri());
}

function saveTokens(t) {
  const oldRefresh = localStorage.getItem("spotify_refresh_token");
  localStorage.setItem("spotify_access_token", t.access_token);
  localStorage.setItem("spotify_expires_at", String(Date.now() + (t.expires_in - 60) * 1000));
  if (t.refresh_token) localStorage.setItem("spotify_refresh_token", t.refresh_token);
  else if (oldRefresh) localStorage.setItem("spotify_refresh_token", oldRefresh);
}

async function refreshAccessToken() {
  const clientId = localStorage.getItem("spotify_client_id");
  const refreshToken = localStorage.getItem("spotify_refresh_token");
  if (!clientId || !refreshToken) throw new Error("Reauthentication required.");

  const body = new URLSearchParams({
    client_id: clientId,
    grant_type: "refresh_token",
    refresh_token: refreshToken
  });

  const r = await fetch(TOKEN_URL, {
    method:"POST",
    headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body
  });
  if (!r.ok) throw new Error("Reauthentication required.");
  saveTokens(await r.json());
}

async function getAccessToken() {
  const token = localStorage.getItem("spotify_access_token");
  const expires = Number(localStorage.getItem("spotify_expires_at") || 0);
  if (!token || Date.now() >= expires) {
    await refreshAccessToken();
  }
  return localStorage.getItem("spotify_access_token");
}

function averageColorFromImage(img) {
  try {
    const c = document.createElement("canvas");
    c.width = 24; c.height = 24;
    const ctx = c.getContext("2d", {willReadFrequently:true});
    ctx.drawImage(img, 0, 0, 24, 24);
    const d = ctx.getImageData(0,0,24,24).data;
    updateGlassPalette(d);
    let r=0,g=0,b=0,n=0;
    for (let i=0;i<d.length;i+=4) {
      if (d[i+3] < 128) continue;
      r += d[i]; g += d[i+1]; b += d[i+2]; n++;
    }
    if (!n) return;
    r/=n; g/=n; b/=n;

    // Spotify-like: darken and slightly enrich the sampled colour.
    const max = Math.max(r,g,b), min = Math.min(r,g,b);
    if (max-min < 18) { r*=.72; g*=.72; b*=.72; }
    else { r*=.62; g*=.62; b*=.62; }
    backdrop.style.setProperty("--bg", `rgb(${r|0},${g|0},${b|0})`);
    document.documentElement.style.setProperty("--bg", `rgb(${r|0},${g|0},${b|0})`);
    document.querySelector('meta[name="theme-color"]').setAttribute("content", `rgb(${r|0},${g|0},${b|0})`);
  } catch(e) {
    // Cross-origin image canvas restrictions can occur. Fallback remains attractive.
  }
}

let lastKey = "";
let polling = false;

async function updateNowPlaying() {
  if (polling) return;
  polling = true;
  try {
    let token = await getAccessToken();
    let r = await fetch(API_URL, {headers:{Authorization:"Bearer "+token}});
    if (r.status === 401) {
      await refreshAccessToken();
      token = await getAccessToken();
      r = await fetch(API_URL, {headers:{Authorization:"Bearer "+token}});
    }

    if (r.status === 204) {
      title.textContent = "Nothing playing";
      artist.textContent = "";
      polling = false;
      return;
    }
    if (!r.ok) throw new Error("Spotify API error " + r.status);

    const data = await r.json();
    const item = data.item;
    if (!item) return;

    const album = item.album || {};
    const images = album.images || item.images || [];
    const imageUrl = images[0]?.url || "";
    const artists = (item.artists || []).map(a => a.name).join(", ");
    const key = item.id + "|" + imageUrl;

    title.textContent = item.name || "";
    artist.textContent = artists;

    if (key !== lastKey && imageUrl) {
      lastKey = key;
      art.classList.remove("loaded");

      const probe = new Image();
      probe.crossOrigin = "anonymous";
      probe.onload = () => {
        if(key !== lastKey)return;
        art.onload = () => art.classList.add("loaded");
        art.src = imageUrl;
        if(art.complete)art.classList.add("loaded");
        art.alt = album.name || item.name || "Album cover";
        averageColorFromImage(probe);
      };
      probe.onerror = () => {
        if(key !== lastKey)return;
        art.onload = () => art.classList.add("loaded");
        art.src = imageUrl;
        if(art.complete)art.classList.add("loaded");
        glassPalette=[[40,44,57],[63,49,64],[74,64,49]];renderGlass();
      };
      probe.src = imageUrl;
    }
  } catch(e) {
    console.error(e);
    if (/Reauthentication|required|403/.test(String(e))) showSetup("Spotify needs you to connect again.");
  } finally {
    polling = false;
  }
}

function showSetup(message="") {
  statusEl.style.display = "flex";
  if (message) hint.textContent = message + "\n\nRedirect URI: " + redirectUri();
}
function hideSetup() { statusEl.style.display = "none"; }

connectBtn.addEventListener("click", startLogin);


$("logout").addEventListener("click", () => {
  ["spotify_access_token","spotify_refresh_token","spotify_expires_at"].forEach(k => localStorage.removeItem(k));
  toggleMenu(false);
  showSetup("Spotify login reset.");
});

document.addEventListener("visibilitychange", () => {
  if (!document.hidden) updateNowPlaying();
});

(async function init(){
  const params = new URLSearchParams(location.search);
  const code = params.get("code");
  const state = params.get("state");
  const expected = sessionStorage.getItem("oauth_state");

  try {
    if (params.get("error")) throw new Error("Spotify authorization was cancelled.");
    if (code) {
      if (!state || !expected || state !== expected) throw new Error("Spotify login state mismatch.");
      await exchangeCode(code);
    }

    if (localStorage.getItem("spotify_refresh_token") || localStorage.getItem("spotify_access_token")) {
      hideSetup();
      await updateNowPlaying();
      setInterval(updateNowPlaying, 3000);
    } else {
      showSetup();
    }
  } catch(e) {
    console.error(e);
    showSetup(e.message || "Could not connect to Spotify.");
  }
})();
</script>
